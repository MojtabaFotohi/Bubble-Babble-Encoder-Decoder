<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Babble Encoder/Decoder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Bubble Babble Encoder/Decoder</h1>
        <textarea id="input" placeholder="Enter input (plain text for encode, encoded string for decode)"></textarea>
        <div class="buttons">
            <button onclick="encodeIt()">Encode</button>
            <button onclick="decodeIt()">Decode</button>
        </div>
        <textarea id="output" readonly placeholder="Output will be displayed here"></textarea>
    </div>
    <script src="script.js"></script>
</body>
</html>
